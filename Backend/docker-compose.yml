version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: templo_bol
      POSTGRES_USER: templo_user
      POSTGRES_PASSWORD: templo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - templo-network

  # Backend FastAPI
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:7tronoszeus1234@localhost:5432/Templo2
      - SECRET_KEY=tu_clave_secreta_super_segura_aqui
    depends_on:
      - db
    networks:
      - templo-network
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  templo-network:
    driver: bridge